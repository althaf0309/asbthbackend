# ASB Training Hub - nginx site config
#
# Obtain certificates first:
#   certbot certonly --nginx -d asbtraininghub.com -d www.asbtraininghub.com
#
# Put `server_tokens off;` and the two limit_req zones in the http{} block of
# /etc/nginx/nginx.conf, or include this file's top section from there.

# --- these belong in the http{} context -------------------------------------
# server_tokens off;
# limit_req_zone $binary_remote_addr zone=asb_api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=asb_forms:10m rate=1r/s;
# ----------------------------------------------------------------------------

# NOTE: server_tokens is NOT declared here. This file is included into http{},
# where /etc/nginx/nginx.conf already sets it - a second declaration in the same
# context is a fatal "duplicate directive" error. It is set per server block
# below instead, which legally overrides the http-level value.
#
# If nginx reports a duplicate limit_req_zone, the zones are already declared in
# nginx.conf; delete the two lines below and keep the http-level ones.
limit_req_zone $binary_remote_addr zone=asb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=asb_forms:10m rate=1r/s;

# 1. Redirect all plaintext traffic to https on the canonical host.
server {
    listen 80;
    listen [::]:80;
    server_name asbtraininghub.com www.asbtraininghub.com;
    server_tokens off;

    # Leave the ACME challenge reachable over http so renewals keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.asbtraininghub.com$request_uri;
    }
}

# 2. Redirect the apex host to www, so link equity is not split across two
#    hostnames that both return 200.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asbtraininghub.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/asbtraininghub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asbtraininghub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.asbtraininghub.com$request_uri;
}

# 3. The canonical site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.asbtraininghub.com;
    server_tokens off;

    root /var/www/asbtraininghub/frontend/dist;
    index index.html;

    client_max_body_size 20M;
    client_body_timeout 20s;
    client_header_timeout 20s;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/asbtraininghub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asbtraininghub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No ssl_protocols / ssl_ciphers / ssl_prefer_server_ciphers / ssl_session_*
    # here on purpose. certbot's options-ssl-nginx.conf (included above) already
    # sets all of them, and a second declaration in the same context is a fatal
    # "duplicate directive". Certbot's defaults are current and get updated with
    # the package, so there is nothing worth overriding.
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    # `always` so they are sent on error responses too. The backend sends its
    # own copies via helmet; these cover the statically served SPA.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Mirrors the helmet policy in backend/src/index.js. Keep the two in sync.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # --- Static brand/search assets ----------------------------------------
    # Serve as real files. Do not let SPA fallback return HTML for icons.
    location ~* ^/(favicon\.ico|favicon-16x16\.png|favicon-32x32\.png|favicon-48x48\.png|android-chrome-192x192\.png|apple-touch-icon\.png|asb-logo\.png|site-logo\.png|site-icon\.png|site\.webmanifest|robots\.txt|llms\.txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        types { font/woff2 woff2; }
    }

    # Fingerprinted build output can be cached hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Dynamic sitemap ---------------------------------------------------
    # Includes newly added backend blog pages without rebuilding the frontend.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---------------------------------------------------------------
    # The public form endpoints get the tighter bucket; the backend applies its
    # own limits as well, so a bypass of one still hits the other.
    location = /api/admin/login {
        limit_req zone=asb_forms burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000/api/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(inquiries|applications|newsletters)$ {
        limit_req zone=asb_forms burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=asb_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Blog: server-rendered for SEO -------------------------------------
    # Blog pages need backend-rendered SEO tags so Google does not see the
    # homepage canonical.
    location = /blog {
        proxy_pass http://127.0.0.1:5000/blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/blog/.+\.(png|jpe?g|webp|gif|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /blog/ {
        proxy_pass http://127.0.0.1:5000/blog/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin -------------------------------------------------------------
    # Never cached, never indexed, even if robots.txt is ignored.
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
