# Covers both /training/category/<id> and /training/<slug>; the backend
# registers the category route first so the two cannot collide.
location /training/ {
    proxy_pass http://127.0.0.1:5000/training/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
