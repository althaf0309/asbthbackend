# Server-rendered SEO routes -> Node backend
#
# Drop-in for the existing asbtraininghub.com server block. Include it from
# inside that block, ABOVE the `location / { try_files ... /index.html; }`
# fallback:
#
#     include /etc/nginx/snippets/asb-ssr-routes.conf;
#
# Why this exists: /courses, /course/<slug> and /training/... are rendered by
# the backend so each page ships its own <title>, canonical and schema.org
# JSON-LD. Without these locations nginx answers them from the SPA shell and
# every one of those URLs reports the homepage canonical to Google.
#
# Uploaded images are served from /uploads/, which the main config already
# handles, so no asset carve-out is needed here.

# --- Courses -----------------------------------------------------------
location = /courses {
    proxy_pass http://127.0.0.1:5000/courses;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Category pages: /courses/erp, /courses/ai, ...
location /courses/ {
    proxy_pass http://127.0.0.1:5000/courses/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Detail pages: /course/<slug>
location /course/ {
    proxy_pass http://127.0.0.1:5000/course/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

